<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LABEL COUNTER — エーオーアイ箱物シール計算</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+JP:wght@300;400;500&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e0e;
    --surface: #161616;
    --surface2: #1e1e1e;
    --border: #2a2a2a;
    --border-active: #555;
    --text: #e8e8e8;
    --text-dim: #666;
    --text-mid: #999;
    --accent: #f0c040;
    --accent-dim: rgba(240,192,64,0.12);
    --red: #e05050;
    --mono: 'DM Mono', monospace;
    --sans: 'Noto Sans JP', sans-serif;
    --display: 'Bebas Neue', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 16px 80px;
  }

  /* ── HEADER ── */
  header {
    width: 100%;
    max-width: 540px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 20px;
    margin-bottom: 40px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .header-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--accent);
    text-transform: uppercase;
  }

  .header-title {
    font-family: var(--display);
    font-size: 42px;
    letter-spacing: 0.06em;
    line-height: 1;
    color: var(--text);
  }

  .header-sub {
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 300;
    color: var(--text-dim);
    letter-spacing: 0.05em;
    margin-top: 6px;
  }

  /* ── MAIN ── */
  main {
    width: 100%;
    max-width: 540px;
    display: flex;
    flex-direction: column;
    gap: 32px;
  }

  /* ── SECTION ── */
  .section {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .section-header {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }

  .section-num {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--accent);
    letter-spacing: 0.15em;
  }

  .section-title {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-mid);
  }

  /* ── FIELD ── */
  .field {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .field-label {
    font-size: 11px;
    font-weight: 400;
    color: var(--text-dim);
    letter-spacing: 0.08em;
  }

  /* ── NUMBER INPUT ── */
  .number-input-wrap {
    display: flex;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 2px;
    overflow: hidden;
    transition: border-color 0.15s;
  }

  .number-input-wrap:focus-within {
    border-color: var(--accent);
  }

  .number-input-wrap button {
    width: 44px;
    height: 52px;
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.1s, color 0.1s;
    flex-shrink: 0;
  }

  .number-input-wrap button:hover {
    background: var(--surface2);
    color: var(--text);
  }

  .number-input-wrap input[type="number"] {
    flex: 1;
    height: 52px;
    background: none;
    border: none;
    color: var(--text);
    font-family: var(--mono);
    font-size: 26px;
    font-weight: 500;
    text-align: center;
    outline: none;
    -moz-appearance: textfield;
    min-width: 0;
  }

  .number-input-wrap input[type="number"]::-webkit-inner-spin-button,
  .number-input-wrap input[type="number"]::-webkit-outer-spin-button {
    -webkit-appearance: none;
  }

  /* ── RADIO CHIPS ── */
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .chips input[type="radio"] { display: none; }

  .chips label {
    padding: 8px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 2px;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text-mid);
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
  }

  .chips input[type="radio"]:checked + label {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent);
  }

  .chips label:hover {
    border-color: var(--border-active);
    color: var(--text);
  }

  /* ── CUSTOM INPUT ── */
  .custom-field {
    display: none;
    flex-direction: column;
    gap: 8px;
  }

  .custom-field.visible { display: flex; }

  /* ── DIVIDER ── */
  .divider {
    height: 1px;
    background: var(--border);
    margin: 4px 0;
  }

  /* ── COMPUTE BUTTON ── */
  .btn-compute {
    width: 100%;
    height: 56px;
    background: var(--accent);
    border: none;
    border-radius: 2px;
    color: #0e0e0e;
    font-family: var(--display);
    font-size: 22px;
    letter-spacing: 0.12em;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    margin-top: 8px;
  }

  .btn-compute:hover { opacity: 0.88; }
  .btn-compute:active { transform: scale(0.99); }

  /* ── RESULT PANEL ── */
  .result-panel {
    border: 1px solid var(--border);
    border-radius: 2px;
    overflow: hidden;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.3s, transform 0.3s;
  }

  .result-panel.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .result-block {
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .result-block-title {
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-mid);
    font-family: var(--mono);
    margin-bottom: 2px;
  }

  /* 総数：小さめ・控えめ */
  .result-total-line {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    opacity: 0.5;
  }

  .result-total-line .result-line-label {
    font-size: 11px;
  }

  .result-total-line .result-line-value {
    font-family: var(--mono);
    font-size: 16px;
    color: var(--text-mid);
    letter-spacing: 0.02em;
  }

  /* 台紙＋バラ セット */
  .result-set {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 2px;
    display: flex;
    overflow: hidden;
  }

  .result-set-item {
    flex: 1;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .result-set-item + .result-set-item {
    border-left: 1px solid var(--border);
  }

  .result-set-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.16em;
    color: var(--text-mid);
    text-transform: uppercase;
  }

  .result-set-value {
    font-family: var(--mono);
    font-size: 32px;
    color: var(--text);
    letter-spacing: -0.02em;
    line-height: 1;
  }

  .result-set-value.is-bara {
    color: var(--accent);
    font-size: 26px;
  }

  .result-set-frac {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-mid);
    letter-spacing: 0.04em;
    margin-top: 4px;
  }

  .result-set-unit {
    font-size: 12px;
    color: var(--text-dim);
    margin-left: 3px;
  }

  .result-line-label {
    font-size: 12px;
    color: var(--text-mid);
    letter-spacing: 0.06em;
    flex-shrink: 0;
  }

  .result-sep {
    height: 1px;
    background: var(--border);
    margin: 0 24px;
  }

  /* ── ERROR ── */
  .error-msg {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--red);
    display: none;
  }

  .error-msg.visible { display: block; }

  /* ── FOOTER ── */
  footer {
    margin-top: 60px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.12em;
    text-align: center;
  }

</style>
</head>
<body>

<header>
  <div class="header-label">AOI LOGISTICS</div>
  <div class="header-title">LABEL COUNTER</div>
  <div class="header-sub">外箱1枚固定　中身2 / 8 / 10 + 任意入力対応　分数表示</div>
</header>

<main>

  <!-- SECTION 01: 基本 -->
  <div class="section">
    <div class="section-header">
      <span class="section-num">01</span>
      <span class="section-title">基本設定</span>
    </div>

    <div class="field">
      <div class="field-label">箱の総数</div>
      <div class="number-input-wrap">
        <button type="button" onclick="stepNum('boxCount', -1)">−</button>
        <input type="number" id="boxCount" value="0" min="0" inputmode="numeric">
        <button type="button" onclick="stepNum('boxCount', 1)">＋</button>
      </div>
      <div class="error-msg" id="err-box">1以上の数を入力してください</div>
    </div>
  </div>

  <!-- SECTION 02: 外箱 -->
  <div class="section">
    <div class="section-header">
      <span class="section-num">02</span>
      <span class="section-title">外箱用シール</span>
    </div>

    <div class="field">
      <div class="field-label">箱あたり枚数</div>
      <div style="font-family: var(--mono); font-size:18px; color: var(--text-mid); padding: 4px 0 0;">1 枚固定</div>
    </div>

    <div class="field">
      <div class="field-label">綴り枚数</div>
      <div class="chips" id="outerBinding">
        <input type="radio" name="outerBinding" id="ob12" value="12" checked>
        <label for="ob12">12枚綴り</label>
        <input type="radio" name="outerBinding" id="ob10" value="10">
        <label for="ob10">10枚綴り</label>
        <input type="radio" name="outerBinding" id="ob9" value="9">
        <label for="ob9">9枚綴り</label>
        <input type="radio" name="outerBinding" id="ob8" value="8">
        <label for="ob8">8枚綴り</label>
        <input type="radio" name="outerBinding" id="ob0" value="0">
        <label for="ob0">なし</label>
      </div>
    </div>
  </div>

  <!-- SECTION 03: 中身 -->
  <div class="section">
    <div class="section-header">
      <span class="section-num">03</span>
      <span class="section-title">中身用シール</span>
    </div>

    <div class="field">
      <div class="field-label">箱あたり枚数（中身）</div>
      <div class="chips" id="innerCountChips">
        <input type="radio" name="innerCount" id="ic2" value="2" checked>
        <label for="ic2">2個入り</label>
        <input type="radio" name="innerCount" id="ic8" value="8">
        <label for="ic8">8個入り</label>
        <input type="radio" name="innerCount" id="ic10" value="10">
        <label for="ic10">10個入り</label>
        <input type="radio" name="innerCount" id="icCustom" value="custom">
        <label for="icCustom">任意</label>
      </div>

      <div class="custom-field" id="customCountField">
        <div class="field-label">任意の個数</div>
        <div class="number-input-wrap">
          <button type="button" onclick="stepNum('customCount', -1)">−</button>
          <input type="number" id="customCount" value="1" min="1" inputmode="numeric">
          <button type="button" onclick="stepNum('customCount', 1)">＋</button>
        </div>
      </div>
    </div>

    <div class="field">
      <div class="field-label">綴り枚数</div>
      <div class="chips">
        <input type="radio" name="innerBinding" id="ib10" value="10" checked>
        <label for="ib10">10枚綴り</label>
        <input type="radio" name="innerBinding" id="ib12" value="12">
        <label for="ib12">12枚綴り</label>
        <input type="radio" name="innerBinding" id="ib9" value="9">
        <label for="ib9">9枚綴り</label>
        <input type="radio" name="innerBinding" id="ib8" value="8">
        <label for="ib8">8枚綴り</label>
      </div>
    </div>
  </div>

  <!-- COMPUTE -->
  <button class="btn-compute" onclick="compute()">CALCULATE</button>

  <!-- RESULT -->
  <div class="result-panel" id="resultPanel">

    <!-- 外箱 -->
    <div class="result-block">
      <div class="result-block-title">外箱用シール</div>
      <div class="result-total-line">
        <span class="result-line-label">総数</span>
        <span class="result-line-value" id="res-outer-bara">—</span>
      </div>
      <div class="result-set">
        <div class="result-set-item">
          <div class="result-set-label">台紙</div>
          <div class="result-set-value" id="res-outer-daishi">—<span class="result-set-unit">枚</span></div>
        </div>
        <div class="result-set-item">
          <div class="result-set-label">バラ</div>
          <div class="result-set-value is-bara" id="res-outer-frac">—</div>
          <div class="result-set-frac" id="res-outer-frac-sub"></div>
        </div>
      </div>
    </div>

    <div class="result-sep"></div>

    <!-- 中身 -->
    <div class="result-block">
      <div class="result-block-title">中身用シール</div>
      <div class="result-total-line">
        <span class="result-line-label">総数</span>
        <span class="result-line-value" id="res-inner-bara">—</span>
      </div>
      <div class="result-set">
        <div class="result-set-item">
          <div class="result-set-label">台紙</div>
          <div class="result-set-value" id="res-inner-daishi">—<span class="result-set-unit">枚</span></div>
        </div>
        <div class="result-set-item">
          <div class="result-set-label">バラ</div>
          <div class="result-set-value is-bara" id="res-inner-frac">—</div>
          <div class="result-set-frac" id="res-inner-frac-sub"></div>
        </div>
      </div>
    </div>

  </div>

</main>

<footer>BY CAPTAIN — AOI LABEL SYSTEM</footer>

<script>
  // ── ステッパー ──
  function stepNum(id, delta) {
    const el = document.getElementById(id);
    const min = parseInt(el.min) || 0;
    el.value = Math.max(min, (parseInt(el.value) || 0) + delta);
  }

  // ── 任意チップ切り替え ──
  document.querySelectorAll('input[name="innerCount"]').forEach(r => {
    r.addEventListener('change', () => {
      const cf = document.getElementById('customCountField');
      cf.classList.toggle('visible', r.value === 'custom' && r.checked);
    });
  });

  // ── 切り上げ除算 ──
  function ceilDiv(numerator, denominator) {
    return Math.ceil(numerator / denominator);
  }

  // ── 分数表示 ──
  function fracLabel(total, binding) {
    if (!binding) return '';
    const full = Math.floor(total / binding);
    const rem  = total % binding;
    if (rem === 0) return `${full}枚（端数なし）`;
    return `${full}枚 + ${rem}/${binding}`;
  }

  // ── 計算 ──
  function compute() {
    const errBox = document.getElementById('err-box');
    const boxCount = parseInt(document.getElementById('boxCount').value) || 0;

    if (boxCount <= 0) {
      errBox.classList.add('visible');
      return;
    }
    errBox.classList.remove('visible');

    // 外箱
    const outerTotal = boxCount * 1;
    const outerBinding = parseInt(document.querySelector('input[name="outerBinding"]:checked').value);

    // 中身
    const innerVal = document.querySelector('input[name="innerCount"]:checked').value;
    const innerPer = innerVal === 'custom'
      ? (parseInt(document.getElementById('customCount').value) || 1)
      : parseInt(innerVal);
    const innerTotal = boxCount * innerPer;
    const innerBinding = parseInt(document.querySelector('input[name="innerBinding"]:checked').value);

    // 台紙・端数
    const outerSheets = outerBinding > 0 ? Math.ceil(outerTotal / outerBinding) : 0;
    const outerRem    = outerBinding > 0 ? outerTotal % outerBinding : 0;
    const innerSheets = Math.ceil(innerTotal / innerBinding);
    const innerRem    = innerTotal % innerBinding;

    // 外箱表示
    document.getElementById('res-outer-bara').textContent     = `${outerTotal} 枚`;
    document.getElementById('res-outer-daishi').innerHTML     = outerBinding > 0
      ? `${outerSheets}<span class="result-set-unit">枚</span>`
      : `—<span class="result-set-unit">（なし）</span>`;
    document.getElementById('res-outer-frac').textContent     = outerBinding > 0 ? `${outerRem} 枚` : '—';
    document.getElementById('res-outer-frac-sub').textContent = outerBinding > 0 ? `${outerRem} ／ ${outerBinding}` : '';

    // 中身表示
    document.getElementById('res-inner-bara').textContent     = `${innerTotal} 枚`;
    document.getElementById('res-inner-daishi').innerHTML     = `${innerSheets}<span class="result-set-unit">枚</span>`;
    document.getElementById('res-inner-frac').textContent     = `${innerRem} 枚`;
    document.getElementById('res-inner-frac-sub').textContent = `${innerRem} ／ ${innerBinding}`;

    // パネル表示
    const panel = document.getElementById('resultPanel');
    panel.classList.add('visible');
    panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  // Enter キー対応
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') compute();
  });
</script>
</body>
</html>
